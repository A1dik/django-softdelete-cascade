[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-softdelete-cascade"
version = "1.0.0"
description = "Production-ready Django library for soft delete with cascade support, admin integration, and comprehensive testing"
readme = "README.md"
authors = [
    {name = "Django SoftDelete Cascade Contributors", email = "noreply@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
]
keywords = ["django", "soft-delete", "cascade", "orm", "database"]
requires-python = ">=3.10"
dependencies = [
    "Django>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "factory-boy>=3.2",
]

[project.urls]
Homepage = "https://github.com/yourusername/django-softdelete-cascade"
Repository = "https://github.com/yourusername/django-softdelete-cascade"

[tool.setuptools]
packages = ["softdelete"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = "-v"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.0.0"
coverage = "^7.12.0"
factory-boy = "^3.3.3"
pytest-django = "^4.11.1"
faker = "^38.2.0"
black = "^25.11.0"
flake8 = "^7.3.0"
mypy = "^1.19.0"
django-stubs = "^5.2.7"

